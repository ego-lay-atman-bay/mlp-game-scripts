[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp-scripts"
authors = [
    { name="ego-lay-atman-bay" },
]
description = " Read ark files in the My Little Pony Gameloft game"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "luna-kit[all]@git+https://github.com/ego-lay-atman-bay/luna-kit/",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/ego-lay-atman-bay/mlp-scripts"
"Bug Tracker" = "https://github.com/ego-lay-atman-bay/mlp-scripts/issues"
# "Documentation" = "https://ego-lay-atman-bay.github.io/mlp-scripts/"

[tool.setuptools]
package-dir = {"" = ""}

[tool.setuptools.dynamic]
version = { attr = ".__version__" }

[project.scripts]
mlp-scripts = '.__main__:main'
