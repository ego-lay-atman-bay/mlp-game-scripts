[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp-scripts"
authors = [
    { name="ego-lay-atman-bay" },
]
description = " Read ark files in the My Little Pony Gameloft game"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "luna-kit[all]",
    # "luna-kit[all]@git+https://github.com/ego-lay-atman-bay/luna-kit/",
    "md-generator",
    "rich>=14.3.2",
    # "md-generator@git+https://github.com/ego-lay-atman-bay/md-generator/",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/ego-lay-atman-bay/mlp-scripts"
"Bug Tracker" = "https://github.com/ego-lay-atman-bay/mlp-scripts/issues"
# "Documentation" = "https://ego-lay-atman-bay.github.io/mlp-scripts/"

[tool.setuptools]
package-dir = {"mlp_scripts" = "mlp_scripts"}

[tool.setuptools.dynamic]
version = { attr = "mlp_scripts.__version__" }

[tool.uv.sources]
luna-kit = { git = "https://github.com/ego-lay-atman-bay/luna-kit/" }
md-generator = { git = "https://github.com/ego-lay-atman-bay/md-generator/" }

[dependency-groups]
dev = [
    "types-lxml>=2026.2.16",
]

[project.scripts]
mlp-scripts = 'mlp_scripts.__main__:main'
